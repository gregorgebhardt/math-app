<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c7cfa"/>
      <stop offset="100%" stop-color="#3b5bdb"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- White circle backdrop for symbols -->
  <circle cx="256" cy="256" r="188" fill="#fff" opacity="0.12"/>

  <!-- + top-left -->
  <text x="112" y="196" font-family="'Helvetica Neue',system-ui,sans-serif"
        font-size="128" font-weight="900" fill="#fff" text-anchor="middle" opacity="0.95">+</text>

  <!-- − top-right -->
  <text x="400" y="196" font-family="'Helvetica Neue',system-ui,sans-serif"
        font-size="128" font-weight="900" fill="#fff" text-anchor="middle" opacity="0.95">−</text>

  <!-- × bottom-left -->
  <text x="112" y="378" font-family="'Helvetica Neue',system-ui,sans-serif"
        font-size="110" font-weight="900" fill="#fff" text-anchor="middle" opacity="0.70">×</text>

  <!-- = bottom-right -->
  <text x="400" y="378" font-family="'Helvetica Neue',system-ui,sans-serif"
        font-size="110" font-weight="900" fill="#fff" text-anchor="middle" opacity="0.70">＝</text>

  <!-- Central number -->
  <text x="256" y="316" font-family="'Helvetica Neue',system-ui,sans-serif"
        font-size="148" font-weight="900" fill="#fff" text-anchor="middle">7</text>

  <!-- Thin decorative ring around the 7 -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#fff" stroke-width="6" opacity="0.35"/>
</svg>
